<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Grande Viagem</title>
<style>
:root{--g:#1f3a2a;--br:#4a2f1a;--sand:#e9d8aa;--gold:#c9a24a;--p1:#b5532c;--p2:#2b7a8a}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:#14231a;color:var(--sand);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}
#title{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0d1a12;overflow:hidden}
#title svg.bg{position:absolute;inset:0;width:100%;height:100%}
#title .c{position:relative;z-index:2;animation:rise 1.6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
h1{font-size:clamp(48px,8vw,110px);letter-spacing:.08em;color:#f6e6b4;text-shadow:0 4px 0 #6b4a1a,0 10px 40px #000}
.sub{font-size:clamp(18px,2.4vw,30px);font-style:italic;margin:6px 0 34px;color:#fff3cf;text-shadow:0 2px 10px #000}
.btn{display:block;margin:12px auto;min-width:260px;padding:14px 30px;font-size:20px;letter-spacing:.12em;border-radius:8px;border:2px solid var(--gold);color:#2b1a0a;background:linear-gradient(#f2dc9a,#c9a24a);box-shadow:0 5px 0 #6b4a1a,0 10px 25px #0008;transition:.15s;font-weight:bold}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6b4a1a}
.btn.big{font-size:28px;padding:18px 40px}.btn.dark{background:linear-gradient(#3b5a43,#1f3a2a);color:var(--sand);min-width:0;font-size:15px;padding:9px 14px;margin:6px 0;width:100%;letter-spacing:.06em}
.btn:disabled{opacity:.5;pointer-events:none}
#sun{animation:glow 5s ease-in-out infinite alternate}@keyframes glow{to{opacity:.7;transform:scale(1.06)}}
.cloud{animation:drift 60s linear infinite}@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1700px)}}
#game{flex-direction:column;background:radial-gradient(#26452f,#0f1d15)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;height:86px;background:linear-gradient(#3a2412,#26170b);border-bottom:3px solid var(--gold)}
header h2{font-size:28px;letter-spacing:.12em;color:#f6e6b4}
.pc{display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:10px;border:2px solid #0000;background:#0003;min-width:250px;transition:.3s;opacity:.65}
.pc.act{opacity:1;border-color:var(--gold);box-shadow:0 0 22px var(--gold);background:#0006;transform:scale(1.05)}
.dot{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid #fff8;box-shadow:inset -4px -4px 8px #0006}
.pc b{display:block;font-size:18px}.pc small{opacity:.8}.pc .sc{margin-left:auto;font-size:34px;color:#ffe08a;font-weight:bold}
main{flex:1;display:flex;gap:16px;padding:12px 16px;min-height:0}
#bw{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
#board{position:relative;width:min(100%,calc((100vh - 130px)*1.6667));aspect-ratio:5/3;border:9px solid #3a2412;border-radius:12px;box-shadow:0 0 0 2px var(--gold),0 20px 60px #000;overflow:hidden;background:#1d4d5e}
#map{position:absolute;inset:0;width:100%;height:100%}
.an{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.5s ease-in-out infinite alternate}@keyframes bob{to{transform:translate(3px,-1px) scaleY(1.03)}}
.rg{position:absolute;left:2%;font-size:clamp(14px,2.4vw,34px);letter-spacing:.3em;font-weight:bold;color:#2b1a0a40}
#trail{position:absolute;inset:0;width:100%;height:100%}
.cw{position:absolute;width:3.9%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 3px #0008)}
.cell{width:100%;height:100%;background:radial-gradient(circle at 35% 30%,#fff6,#0000 60%),var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border:0;text-shadow:0 1px 3px #000}
.cell i{font-style:normal;font-size:clamp(10px,1.4vw,20px);font-weight:bold;line-height:1}.cell b{font-size:clamp(7px,.8vw,11px);opacity:.85}
.cell[data-t=D]{border-radius:50%}.cell[data-t=C]{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.cell[data-t=S]{clip-path:polygon(50% 0,63% 35%,100% 38%,70% 60%,80% 98%,50% 76%,20% 98%,30% 60%,0 38%,37% 35%)}
.cell[data-t=O]{clip-path:polygon(50% 0,100% 100%,0 100%)}.cell[data-t=O] i{margin-top:30%}.cell[data-t=O] b{display:none}
.cell[data-t=A]{border-radius:22%;transform:rotate(45deg) scale(.78)}.cell[data-t=A]>*{transform:rotate(-45deg)}
.cell[data-t=M]{clip-path:polygon(0 20%,60% 20%,60% 0,100% 50%,60% 100%,60% 80%,0 80%)}
.cell[data-t=I],.cell[data-t=F]{border-radius:50%;border:4px solid #ffe08a}.cw.big{width:5.2%}
.cell[data-t=I] i,.cell[data-t=F] i{font-size:clamp(9px,1.2vw,16px)}
.lbl{position:absolute;transform:translate(-50%,0);font-size:clamp(8px,1vw,13px);font-weight:bold;color:#2b1a0a;background:#f2e2b0cc;padding:1px 7px;border-radius:4px;white-space:nowrap}
.pawn{position:absolute;width:3.3%;aspect-ratio:.58;transform:translate(-50%,-86%);transition:left .26s ease-in-out,top .26s ease-in-out;z-index:5}
.pawn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 4px 3px #000a)}
.pawn.hop{animation:hop .26s}@keyframes hop{50%{margin-top:-14px}}
aside{width:290px;display:flex;flex-direction:column;gap:8px;padding:14px;background:linear-gradient(#e9d8aa,#cfb87e);color:#2b1a0a;border:3px solid #4a2f1a;border-radius:12px;box-shadow:inset 0 0 30px #7a5a2a88,0 10px 30px #000a}
aside h3{font-size:15px;letter-spacing:.1em;border-bottom:1px solid #4a2f1a66;padding-bottom:3px}
#turn{font-size:22px;font-weight:bold}#stage{font-size:14px;font-style:italic}
#die{width:84px;height:84px;margin:6px auto;background:linear-gradient(135deg,#fff,#ddd0b0);border-radius:16px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;box-shadow:0 6px 0 #9a8a60,0 10px 20px #0006}
#die.roll{animation:spin .35s linear infinite}@keyframes spin{to{transform:rotate(360deg) scale(1.1)}}
#die span.p{width:15px;height:15px;border-radius:50%;background:#2b1a0a;place-self:center;box-shadow:inset -2px -2px 3px #000a}
#hist{font-size:13px;line-height:1.35;overflow:auto;flex:1;min-height:60px}#hist div{padding:3px 0;border-bottom:1px dotted #4a2f1a55}#hist div:first-child{font-weight:bold}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}#modal.on{display:flex}
.card{width:min(640px,92vw);max-height:92vh;overflow:auto;padding:0 0 22px;border-radius:14px;color:#2b1a0a;background:linear-gradient(#f0e2b6,#d9c38a);border:4px solid #4a2f1a;box-shadow:0 0 0 3px var(--gold),0 25px 70px #000;animation:pop .35s ease}@keyframes pop{from{transform:scale(.8) rotate(-2deg);opacity:0}}
.card .hd{padding:12px 22px;color:#fff;font-size:20px;letter-spacing:.14em;background:var(--c);text-shadow:0 2px 4px #0008;display:flex;justify-content:space-between}
.card .bd{padding:18px 26px 6px;font-size:20px;line-height:1.45}
.opt{display:block;width:calc(100% - 52px);margin:10px 26px 0;padding:12px 16px;text-align:left;font-size:18px;background:#fff8e0;border:2px solid #4a2f1a;border-radius:8px;color:#2b1a0a;transition:.15s}
.opt:hover:not(:disabled){background:#fff;transform:translateX(5px)}.opt.ok{background:#79b36a;border-color:#2c6a22;color:#fff}.opt.no{background:#c2574a;border-color:#7a1f16;color:#fff}.opt:disabled{cursor:default}
.ex{margin:14px 26px 0;padding:12px;border-left:5px solid var(--c);background:#0001;font-size:17px;line-height:1.4}
.card .btn{margin-top:16px;font-size:17px;min-width:200px}
#win{background:radial-gradient(#3a5a2a,#0d1a12);flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:60;overflow:hidden}
#win h1{font-size:clamp(40px,6vw,84px)}.cf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cw{z-index:2}.pawn{z-index:6}.pawn.act{z-index:8}
.pawn.act:after{content:"";position:absolute;left:-28%;right:-28%;bottom:-4%;height:20%;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 12px var(--gold);animation:ring 1.2s ease-in-out infinite alternate;z-index:-1}@keyframes ring{to{transform:scale(1.15);opacity:.6}}
.bd{transform-box:fill-box;transform-origin:50% 100%;animation:idle 1.8s ease-in-out infinite alternate}@keyframes idle{to{transform:scaleY(1.03)}}
.pawn.walk svg{animation:wk .26s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes wk{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .3s ease-in-out infinite alternate}@keyframes fk{to{transform:scale(.85,1.2)}}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.cell[data-t=S],.cell[data-t=A],.cell[data-t=M]{animation:glw 2.6s ease-in-out infinite alternate}@keyframes glw{to{filter:brightness(1.3)}}
#die.roll{animation:tumble .5s linear infinite}@keyframes tumble{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(1.15) translateY(-8px)}100%{transform:rotate(360deg)}}
#die.pop{animation:dpop .45s ease}@keyframes dpop{40%{transform:scale(1.25)}}
.pb{height:5px;min-width:110px;background:#0006;border-radius:3px;margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a24a,#ffe08a);transition:width .5s}
.ab{background:radial-gradient(#27492f,#12261a);color:#f1e3b4;border-color:#c9a24a;text-align:center;padding:26px 28px 22px}
.ab small{letter-spacing:.3em;color:#c9a24a;font-size:13px}.ab h2{font-size:38px;letter-spacing:.14em;color:#f6e6b4;margin:6px 0;text-shadow:0 3px 0 #0006}.ab p{font-size:16px;font-style:italic;opacity:.9}
.ab .sec{margin:22px 0 10px;color:#c9a24a;letter-spacing:.3em;font-size:14px;display:flex;align-items:center;gap:12px}.ab .sec:before,.ab .sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#0000,#c9a24a)}.ab .sec:after{transform:scaleX(-1)}
.ab .dev{font-size:32px;font-weight:bold;color:#2b1a0a;padding:14px;border-radius:10px;border:2px solid #fff5;background:linear-gradient(135deg,#f6e6b4,#c9a24a);box-shadow:0 0 24px #c9a24a66}
.ab .mem{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ab .mem span{padding:11px;border-radius:8px;background:#0004;border:1px solid #c9a24a88;font-size:19px;color:#f6e6b4}
.ab .note{margin-top:18px;font-size:14px;opacity:.75}
@media (prefers-reduced-motion:reduce){.an,.sw,.bd,.cell,.fl{animation:none!important}}
</style></head><body>

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const N=30,END=29,PC=['#b5532c','#2b7a8a'];

const NAME={D:'DESCOBERTA',C:'DESAFIO',S:'SORTE',O:'OBSTÁCULO',A:'ARTEFATO',M:'MIGRAÇÃO'};

 if(S.skip[p]){S.skip[p]=false;log(`Jogador ${p+1} perdeu a vez (obstáculo).`);return next()}
 $('die').classList.add('roll');let v;const iv=setInterval(()=>{face(1+Math.floor(Math.random()*6));tone(300+Math.random()*200,.05,'square',.04)},90);
 await sleep(1000);clearInterval(iv);$('die').classList.remove('roll');v=1+Math.floor(Math.random()*6);face(v);tone(660,.2);$('die').classList.add('pop');setTimeout(()=>$('die').classList.remove('pop'),500);
 log(`Jogador ${p+1} tirou ${v}.`);await sleep(400);
 if(await move(p,v))return;await land(p)}
async function move(p,n){const pe=$('pw'+p);pe.classList.add('walk');for(let k=0;k<n&&S.pos[p]<END;k++){S.pos[p]++;place(p);const e=$('pw'+p);e.classList.remove('hop');void e.offsetWidth;e.classList.add('hop');tone(440+k*40,.1,'triangle');ui();await sleep(300)}
 pe.classList.remove('walk');if(S.pos[p]>=END){win(p);return true}return false}
function next(){S.turn=1-S.turn;busy=false;$('roll').disabled=false;ui()}
function nq(){if(!qpool.length)qpool=Q.map((_,i)=>i).sort(()=>Math.random()-.5);return Q[qpool.pop()]}
function card(t,body,extra=''){return new Promise(r=>{modal(`<div class="card" style="--c:${COL[t]}"><div class="hd"><span>${NAME[t]}</span><span>Jogador ${S.turn+1}</span></div><div class="bd">${body}</div>${extra}<div id="fb"></div></div>`);window._r=r})}
function cont(){closeM();window._r()}
async function land(p){
 const t=T[S.pos[p]],st=STAGES[ST[S.pos[p]]];
 if(t=='D'){S.score[p]+=5;ui();tone(520,.3);const f=FACTS[Math.floor(Math.random()*FACTS.length)];log(`J${p+1} fez uma descoberta (+5).`);
  await card(t,`<i style="font-size:16px">${st}</i><br><br>${f}<br><br><b>+5 pontos!</b>`,`<div style="text-align:center"><button class="btn" onclick="cont()">CONTINUAR</button></div>`)}
 else if(t=='S'){S.score[p]+=5;ui();tone(780,.4);log(`J${p+1} teve sorte: +5 e avança 2 casas.`);
  await card(t,`<i style="font-size:16px">${st}</i><br><br>Um vento favorável e um bom caminho pela savana! Você ganha <b>5 pontos</b> e <b>avança 2 casas</b>.`,`<div style="text-align:center"><button class="btn" onclick="cont()">AVANÇAR</button></div>`);
  if(await move(p,2))return}
 else await quiz(p,t,st);
 next()}
function quiz(p,t,st){
 const q=nq(),o=q[1].map((x,i)=>[x,i]).sort(()=>Math.random()-.5);
 const intro={C:'Desafio sobre evolução humana.',A:'Você encontrou um artefato arqueológico! Mostre que sabe interpretá-lo.',M:'A humanidade segue em movimento. Responda sobre a expansão pelos continentes.',O:'Um obstáculo bloqueia o caminho! Acerte para passar; errar faz você perder a próxima jogada.'}[t];
 const ops=o.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ans(${p},'${t}',${i},${q[2]},this)">${x}</button>`).join('');
 window._q=q;return card(t,`<i style="font-size:15px">${st}</i><br>${intro}<br><br><b>${q[0]}</b>`,ops)}
function ans(p,t,i,c,b){
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i==c)x.classList.add('ok')});
 const ok=i==c;if(!ok)b.classList.add('no');let m;
 if(ok){S.score[p]+=10;tone(784,.3);m='Acertou! +10 pontos.'}else{tone(150,.4,'sawtooth');m='Errou desta vez.';if(t=='O'){S.skip[p]=true;m+=' Perde a próxima jogada.'}}
 if(ok&&t=='O')m+=' Obstáculo superado!';
 log(`J${p+1} em ${NAME[t].toLowerCase()}: ${ok?'acertou (+10)':'errou'}.`);ui();
 $('fb').innerHTML=`<div class="ex"><b>${m}</b><br>${window._q[3]}</div><div style="text-align:center"><button class="btn" onclick="cont()">CONTINUAR</button></div>`}
function win(p){S.score[p]+=20;ui();log(`J${p+1} chegou ao destino (+20)!`);tone(523,.2);setTimeout(()=>tone(659,.2),200);setTimeout(()=>tone(784,.5),400);
 setTimeout(()=>{const w=S.score[0]==S.score[1]?'':S.score[0]>S.score[1]?0:1;
  $('wt').textContent=`Jogador ${p+1} chegou ao destino final: a humanidade se espalhou pelo planeta!`;
  $('wsc').textContent=`Pontuação final — Jogador 1: ${S.score[0]}  |  Jogador 2: ${S.score[1]}`+(w===''?' (empate nos pontos)':`  (mais pontos: Jogador ${w+1})`);
  document.querySelectorAll('.cf').forEach(e=>e.remove());
  for(let i=0;i<120;i++){const d=document.createElement('div');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*60+20},80%,${50+Math.random()*20}%);animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s`;$('win').appendChild(d)}
  show('win')},1200)}
</script></body></html>
